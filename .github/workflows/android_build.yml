name: Build Android APK

on:
  push:
    branches:
      - main # سيبدأ البناء تلقائياً عند رفع كود جديد على هذا الفرع
  workflow_dispatch: # هذا الخيار يسمح لك بتشغيل البناء يدوياً بضغطة زر من موقع جيت هب

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest # استخدام سيرفرات لينكس السريعة من جيت هب

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # إصدار جافا المتوافق مع أحدث نسخ أندرويد

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk # اسم الملف الذي ستقوم بتحميله لاحقاً
          path: build/app/outputs/flutter-apk/app-release.apk